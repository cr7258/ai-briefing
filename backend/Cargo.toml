[package]
name = "ai-briefing-backend"
version = "0.1.0"
edition = "2021"
description = "Daily AI news briefing backend service"
authors = ["AI Briefing Team"]

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# RSS parsing
feed-rs = "2.1"

# HTML parsing (for website scraping)
scraper = "0.20"

# Database ORM
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Environment variables
dotenvy = "0.15"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# Task scheduling
tokio-cron-scheduler = "0.13"

# Markdown text extraction (for TTS)
pulldown-cmark = "0.12"

# Volcengine TOS SDK
ve-tos-rust-sdk = { version = "2.9", features = ["tokio-runtime"] }
async-trait = "0.1"
futures-core = "0.3"

# Retry with backoff
tokio-retry = "0.3"
