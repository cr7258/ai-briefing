name: ai_briefing
description: Daily AI News Briefing App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components - shadcn_flutter
  
  # Supabase
  supabase_flutter: ^2.8.0
  
  # State management
  flutter_riverpod: ^2.5.1
  
  # Audio player
  just_audio: ^0.9.40
  
  # Markdown rendering
  flutter_markdown: ^0.7.4+2
  url_launcher: ^6.3.1
  
  # Date formatting
  intl: ^0.19.0
  
  # Icons
  cupertino_icons: ^1.0.8
  
  # Environment variables
  flutter_dotenv: ^5.2.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.3.3
  iconsax_flutter: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env

