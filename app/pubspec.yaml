name: ai_briefing
description: Daily AI News Briefing App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components - shadcn_flutter
  
  # Supabase
  supabase_flutter: ^2.8.0
  
  # State management
  flutter_riverpod: ^2.5.1
  
  # Audio player
  just_audio: ^0.9.40
  
  # Markdown rendering
  flutter_markdown: ^0.7.4+2
  url_launcher: ^6.3.1
  
  # Date formatting
  intl: ^0.19.0
  
  # Icons
  cupertino_icons: ^1.0.8
  
  # Environment variables
  flutter_dotenv: ^5.2.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.3.3
  iconsax_flutter: ^1.0.1
  font_awesome_flutter: ^10.12.0
  shared_preferences: ^2.5.4
  purchases_flutter: ^8.0.0
  purchases_ui_flutter: ^8.0.0
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/app_icon_1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/

